- name: User
  hosts: all
  become: true
  tasks:
     - name: Disable nodejs module stream
       command: dnf module disable nodejs -y

     - name: Enable nodeJs module stream
       command: dnf module enable nodejs:20 -y

     - name: Install nodejs
       ansible.builtin.package:
         name: nodejs
         state: present

     - name: add roboshop user 
       ansible.builtin.user:
         name: roboshop

     - name: Create user directory
       ansible.builtin.file:
         path: /app
         state: directory

     - name: Download User content
       ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/user-v3.zip
        dest: /tmp/user.zip

     - name: Extract the user content
       ansible.builtin.unarchive:
        src: /tmp/user.zip
        dest: /app
        remote_src: yes

     - name: Install user dependencies
       community.general.npm:
       path: /app

     - name: Update user systemd service file
       ansible.builtin.copy:
        src: files/user.service
        dest: /etc/systemd/system/user.service    

     - name: Start and enable user service
       ansible.builtin.systemd:
        name: user
        daemon_reload: true
        state: started
        enabled: yes