- name: Payment
  hosts: all
  become: true
  tasks:
    - name: install python3 level package
      ansible.builtin.package:
         name: 
           - python3
           - gcc
           - python3-devel
         state: present
   
    - name: Add roboshop user
      ansible.builtin.user:
         name: roboshop

    - name: Create payment directory
      ansible.builtin.file:
         path: /app
         state: directory

    - name: Download payment content
      ansible.builtin.get_url:
         url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip
         dest: /tmp/payment.zip            
     
    - name: Extract the payment content
      ansible.builtin.unarchive:
         src: /tmp/payment.zip
         dest: /app
         remote_src: yes

    - name: Install payment dependencies
      ansible.builtin.pip:
         requirements: /app/requirements.txt      

    - name: Update payment systemd service file
      ansible.builtin.copy:
         src: files/payment.service
         dest: /etc/systemd/system/payment.service  

    - name: Start and enable payment service
      ansible.builtin.systemd:
         name: payment
         daemon_reload: true
         state: started
         enabled: yes
         
                   