- name: Dispatch
  hosts: all
  become: true
  tasks:
    - name: install golang
      ansible.builtin.package:
         name: golang
         state: present

    - name: Add roboshop user
      ansible.builtin.user:
         name: roboshop

    - name: Create dispatch directory
      ansible.builtin.file:
         path: /app
         state: directory

    - name: Download dispatch content
      ansible.builtin.get_url:
         url: https://roboshop-artifacts.s3.amazonaws.com/dispatch-v3.zip
         dest: /tmp/dispatch.zip     

    - name: Extract the dispatch content
      ansible.builtin.unarchive:
         src: /tmp/dispatch.zip
         dest: /app
         remote_src: yes

    - name: Install dispatch dependencies
      ansible.builtin.shell: cd /app && go mod init dispatch && go get && go build     


    - name: Update dispatch systemd service file
      ansible.builtin.copy:
         src: files/dispatch.service
         dest: /etc/systemd/system/dispatch.service 

    - name: Start and enable dispatch service
      ansible.builtin.systemd:
         name: dispatch
         daemon_reload: true
         state: started
         enabled: yes     