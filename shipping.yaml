- name: Shipping
  hosts: all
  become: true
  tasks:
    - name: Install maven
      ansible.builtin.package:
        name: maven
        state: present

    - name: Create shipping user
      ansible.builtin.user:
        name: roboshop
        state: present

    - name: Create shipping directory
      ansible.builtin.file:
         path: /app
         state: directory

    - name: Download shipping content
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip
        dest: /tmp/shipping.zip

    - name: Extract the shipping content
      ansible.builtin.unarchive:
        src: /tmp/shipping.zip
        dest: /app
        remote_src: yes
        
    - name: copy service file
      ansible.builtin.copy:
        src: files/shipping.service
        dest: /etc/systemd/system/shipping.service

    - name: Start and enable shipping service
      ansible.builtin.systemd:
        name: shipping
        daemon_reload: true
        state: started
        enabled: yes              

    - name: install mysql client
      ansible.builtin.package:
        name: mysql
        state: present

    - name: Load schema
      ansible.builtin.shell: mysql -h <MYSQL-SERVER-IPADDRESS> -uroot -pRoboShop@1 < /app/db/schema.sql

    - name: Load app-user schema
      ansible.builtin.shell: mysql -h <MYSQL-SERVER-IPADDRESS> -uroot -pRoboShop@1 < /app/db/app-user.sql

    - name: Load master-data schema
      ansible.builtin.shell: mysql -h <MYSQL-SERVER-IPADDRESS> -uroot -pRoboShop@1 < /app/db/master-data.sql


    - name: restart shipping service
      ansible.builtin.systemd:
        name: shipping
        state: restarted  

        