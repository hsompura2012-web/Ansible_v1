- name: Cart
  hosts: all
  become: true
  tasks:
    - name: Disable nodejs module stream
      command: dnf module disable nodejs -y

    - name: Enable nodeJs module stream
      command: dnf module enable nodejs:20 -y

    - name: Install nodejs
      ansible.builtin.package:
        name: nodejs
        state: present

    - name: add roboshop user 
      ansible.builtin.user:
        name: roboshop

    - name: Create user directory
      ansible.builtin.file:   
        path: /app
        state: directory 

    - name: Create Cart directory
      ansible.builtin.file:
        path: /app
        state: directory

    - name: Download cart content
      ansible.builtin.get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
        dest: /tmp/cart.zip

    - name: Extract the cart content
      ansible.builtin.unarchive:
        src: /tmp/cart.zip
        dest: /app
        remote_src: yes

    - name: Install cart dependencies
      community.general.npm:
        path: /app

    - name: Update cart systemd service file
      ansible.builtin.copy:
        src: files/cart.service
        dest: /etc/systemd/system/cart.service    

    - name: Start and enable cart service
      ansible.builtin.systemd:
        name: cart
        daemon_reload: true
        state: started
        enabled: yes     